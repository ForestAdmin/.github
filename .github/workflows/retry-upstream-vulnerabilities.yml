# forestadmin/.github/.github/workflows/retry-upstream-vulnerabilities.yml
#
# Reusable workflow: daily check for upstream fixes on blocked vulnerabilities.
# Scans open "blocked-upstream" issues, checks if the Forest Admin parent
# package has a new version that resolves the vulnerability, and if so,
# triggers Claude Code to bump + open a PR.

name: Retry blocked upstream vulnerabilities (reusable)

on:
  workflow_call:
    inputs:
      forest_package_patterns:
        description: "Regex to identify org-owned packages"
        type: string
        default: "@forestadmin/|^forest-"
      default_assignee_team:
        description: "Team or user to assign PRs to"
        type: string
        default: "forestadmin/platform"
      node_version:
        description: "Node.js version"
        type: string
        default: "22"
      package_manager:
        description: "Package manager (auto-detected from lockfile if omitted). Values: npm, yarn"
        type: string
        default: ""
      stale_days:
        description: "Days before an issue is considered stale (for notifications)"
        type: number
        default: 14
      security_label:
        description: "Label name for security issues/PRs"
        type: string
        default: ":lock: security"
    secrets:
      ANTHROPIC_API_KEY:
        required: true
      REPO_TOKEN:
        description: "PAT or App token with repo write access (pushes from GITHUB_TOKEN don't trigger CI)"
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  # ──────────────────────────────────────────────
  # Step 1: Find all open blocked-upstream issues
  # ──────────────────────────────────────────────
  find-issues:
    runs-on: ubuntu-latest
    outputs:
      issues: ${{ steps.find.outputs.issues }}
      has_issues: ${{ steps.find.outputs.has_issues }}
    steps:
      - name: Find blocked upstream issues
        id: find
        uses: actions/github-script@v7
        env:
          SECURITY_LABEL: ${{ inputs.security_label }}
        with:
          script: |
            const securityLabel = process.env.SECURITY_LABEL;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: `${securityLabel},blocked-upstream`,
              state: 'open',
              per_page: 50,
            });

            const parsed = issues.map(issue => {
              const body = issue.body || '';
              const pkg = body.match(/\*\*Package\*\*\s*\|\s*`([^`]+)`/)?.[1];
              const cve = body.match(/\*\*CVE\*\*\s*\|\s*(\S+)/)?.[1];
              const forestParent = body.match(/\*\*Forest Admin parent\*\*\s*\|\s*`([^`]+)`/)?.[1];
              const severity = body.match(/\*\*Severity\*\*\s*\|\s*(\S+)/)?.[1];
              const patchedVersion = body.match(/\*\*Patched version\*\*\s*\|\s*([^\s|]+)/)?.[1];
              const epssRaw = body.match(/\*\*EPSS\*\*\s*\|\s*([0-9.]+)/)?.[1];
              const sla = body.match(/\*\*SLA\*\*\s*\|\s*(\d+)\s*days?/)?.[1];
              const createdAt = issue.created_at;

              return {
                issue_number: issue.number,
                title: issue.title,
                pkg,
                cve,
                severity: severity || 'high',
                forest_parent: forestParent,
                patched_version: patchedVersion || '',
                epss: epssRaw || '',
                sla_days: sla || '',
                created_at: createdAt,
              };
            }).filter(i => i.pkg && i.forest_parent);

            core.setOutput('issues', JSON.stringify(parsed));
            core.setOutput('has_issues', (parsed.length > 0).toString());
            core.info(`Found ${parsed.length} blocked upstream issues`);

  # ──────────────────────────────────────────────
  # Step 2: Check each issue for upstream fixes
  # ──────────────────────────────────────────────
  check-and-fix:
    needs: find-issues
    if: needs.find-issues.outputs.has_issues == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        issue: ${{ fromJson(needs.find-issues.outputs.issues) }}
      max-parallel: 2
      fail-fast: false
    concurrency:
      group: upstream-fix-${{ matrix.issue.issue_number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.REPO_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: Detect package manager
        id: pm
        env:
          INPUT_PM: ${{ inputs.package_manager }}
        run: |
          PM="$INPUT_PM"
          if [ -z "$PM" ]; then
            if [ -f yarn.lock ]; then
              PM="yarn"
            elif [ -f pnpm-lock.yaml ]; then
              PM="pnpm"
            else
              PM="npm"
            fi
          fi
          echo "manager=$PM" >> "$GITHUB_OUTPUT"
          echo "Detected package manager: $PM"

      - name: Install dependencies
        env:
          PM: ${{ steps.pm.outputs.manager }}
        run: |
          if [ "$PM" = "yarn" ]; then
            NPM_TOKEN=dummy yarn install --frozen-lockfile --ignore-engines 2>&1 || true
          else
            npm ci --ignore-scripts --no-audit
          fi

      - name: Check if upstream fix is available
        id: check
        env:
          PM: ${{ steps.pm.outputs.manager }}
          FOREST_PARENT: ${{ matrix.issue.forest_parent }}
          VULNERABLE_PKG: ${{ matrix.issue.pkg }}
          PATCHED_VERSION: ${{ matrix.issue.patched_version }}
        run: |
          # Get currently installed version (works with any package manager)
          CURRENT_VERSION=$(node -e "
            try { console.log(require(process.env.FOREST_PARENT + '/package.json').version); }
            catch(e) { }
          " 2>/dev/null)

          if [ -z "$CURRENT_VERSION" ]; then
            echo "Could not determine current version of $FOREST_PARENT"
            echo "fixed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Get latest available version from the registry
          LATEST_VERSION=$(npm view "$FOREST_PARENT" version 2>/dev/null || true)

          if [ -z "$LATEST_VERSION" ] || [ "$CURRENT_VERSION" = "$LATEST_VERSION" ]; then
            echo "No new version of $FOREST_PARENT (current: $CURRENT_VERSION)"
            echo "fixed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "New version available: $FOREST_PARENT $CURRENT_VERSION -> $LATEST_VERSION"

          # Determine lockfile for reset
          if [ "$PM" = "yarn" ]; then
            LOCKFILE="yarn.lock"
          else
            LOCKFILE="package-lock.json"
          fi

          # Tentatively update the Forest Admin parent
          if [ "$PM" = "yarn" ]; then
            NPM_TOKEN=dummy yarn add "$FOREST_PARENT@$LATEST_VERSION" --ignore-engines
          else
            npm install "$FOREST_PARENT@$LATEST_VERSION" --save
          fi

          # Check if the vulnerable transitive dep is now at a safe version
          RESOLVED=$(node -e "
            try { console.log(require(process.env.VULNERABLE_PKG + '/package.json').version); }
            catch(e) { }
          " 2>/dev/null)

          STILL_VULNERABLE="false"
          if [ -n "$RESOLVED" ] && [ -n "$PATCHED_VERSION" ]; then
            # Compare resolved version against patched version
            export RESOLVED PATCHED_VERSION
            STILL_VULNERABLE=$(node -e "
              const r = process.env.RESOLVED.split('.').map(Number);
              const p = process.env.PATCHED_VERSION.split('.').map(Number);
              const vulnerable = r[0] < p[0] || (r[0] === p[0] && (r[1] < p[1] || (r[1] === p[1] && r[2] < p[2])));
              console.log(vulnerable ? 'true' : 'false');
            " 2>/dev/null || echo "false")
          fi

          if [ "$STILL_VULNERABLE" = "true" ]; then
            echo "Updated $FOREST_PARENT but $VULNERABLE_PKG ($RESOLVED) is still below patched version ($PATCHED_VERSION)"
            echo "fixed=false" >> "$GITHUB_OUTPUT"
            git checkout -- package.json "$LOCKFILE"
          else
            echo "Vulnerability resolved by bumping $FOREST_PARENT to $LATEST_VERSION"
            echo "fixed=true" >> "$GITHUB_OUTPUT"
            echo "forest_parent=$FOREST_PARENT" >> "$GITHUB_OUTPUT"
            echo "new_version=$LATEST_VERSION" >> "$GITHUB_OUTPUT"
            echo "old_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
            # Reset — let Claude do the clean bump with lint/test
            git checkout -- package.json "$LOCKFILE"
          fi

      # ── Checkout or create security branch ──
      - name: Checkout security branch
        if: steps.check.outputs.fixed == 'true'
        env:
          BRANCH: security/fix-${{ matrix.issue.pkg }}-${{ matrix.issue.cve }}
        run: |
          # Ensure we have main ref (shallow clone may not include it)
          git fetch --depth=1 origin main
          # Reuse existing remote branch if it exists, otherwise create new
          if git ls-remote --heads origin "$BRANCH" | grep -q "$BRANCH"; then
            git fetch origin "$BRANCH"
            git checkout "$BRANCH"
            git reset --hard origin/main
          else
            git checkout -b "$BRANCH" origin/main
          fi

      # ── Claude Code: bump, lint, test ──
      - name: Fix with Claude Code
        if: steps.check.outputs.fixed == 'true'
        id: claude
        uses: anthropics/claude-code-action@v1
        env:
          NPM_TOKEN: dummy
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          show_full_output: true
          claude_args: "--dangerously-skip-permissions"
          prompt: |
            Fix a security vulnerability by bumping a Forest Admin dependency.

            ## Vulnerability info
            - Forest Admin parent package: ${{ steps.check.outputs.forest_parent }}
            - Current version: ${{ steps.check.outputs.old_version }}
            - New version: ${{ steps.check.outputs.new_version }}
            - Vulnerable transitive dep: ${{ matrix.issue.pkg }}
            - CVE: ${{ matrix.issue.cve }}
            - Severity: ${{ matrix.issue.severity }}
            - Patched version: ${{ matrix.issue.patched_version }}

            ## Environment
            - Node.js ${{ inputs.node_version }} is already installed. Do NOT install or switch Node versions.
            - Dependencies are already installed (yarn install was run).
            - NPM_TOKEN is set — use `yarn` commands directly.
            - Do NOT create branches, commit, push, or open PRs. The workflow handles git.
            - Do NOT use subagents/Task tool — work directly.
            - Do NOT add new dependencies or devDependencies (no patch-package, no postinstall scripts).
            - Do NOT create new files or directories (no patches/ dir, no shims).
            - You MAY modify existing source files (.ts, .js) if the bump introduces breaking
              changes (renamed exports, changed APIs, etc.). Adapt the code to the new version.

            ## Steps

            ### 1. Investigate (keep it focused)
            - Check the GitHub releases or CHANGELOG for ${{ steps.check.outputs.forest_parent }}
              between ${{ steps.check.outputs.old_version }} and ${{ steps.check.outputs.new_version }}.
              Use a single WebFetch to the releases page — do NOT download and diff
              multiple package tarballs.
            - Also check the changelog for "${{ matrix.issue.pkg }}" (the vulnerable transitive dep).
            - Search the codebase for direct usages: `grep -r "${{ steps.check.outputs.forest_parent }}" --include="*.ts" --include="*.js" -l`
            - Identify ANY behavioral changes (new defaults, removed APIs, changed validation).

            ### 2. Apply the fix
            This is a monorepo. Prefer making changes in the child package that uses the
            dependency. Only modify the root package.json as a last resort.

            **Priority order:**
            1. **Direct dependency in a child package.json** — bump the version there.
            2. **Transitive dependency of a child package** — add a `"resolutions"` entry
               in that child's package.json. Example:
               ```json
               "resolutions": {
                 "${{ matrix.issue.pkg }}": ">=${{ matrix.issue.patched_version }}"
               }
               ```
            3. **No clear child owner (used by multiple packages or only at root)** —
               add the `"resolutions"` entry in the root package.json.

            If a `"resolutions"` field already exists, add to it — do NOT replace it.
            - IMPORTANT: You MUST modify a package.json. Lockfile-only changes are NOT acceptable
              because they get overwritten on the next `yarn install`.
            - Run `yarn install --ignore-engines` to regenerate the lockfile.
            - Verify the new version is installed: `yarn list ${{ matrix.issue.pkg }}`
            - Verify a package.json was actually modified (it must be in the diff).

            ### 3. Validate
            - Run `yarn lint` and fix any issues.
            - Run `yarn test` and fix any issues.

            ### 4. Output summary
            When done, output exactly this format:

            <pr-description>
            ## Security: bump ${{ steps.check.outputs.forest_parent }} (${{ steps.check.outputs.old_version }} → ${{ steps.check.outputs.new_version }}) [${{ matrix.issue.cve }}]

            Closes #${{ matrix.issue.issue_number }}

            **CVE**: ${{ matrix.issue.cve }}
            **Severity**: ${{ matrix.issue.severity }}
            **Summary**: Vulnerability in ${{ matrix.issue.pkg }} fixed by bumping ${{ steps.check.outputs.forest_parent }}

            ### Changes made
            (describe what you changed — which files, resolution vs direct bump)

            ### Behavioral changes
            (list any non-security behavioral changes, or "None beyond the security fix")

            ### Behavioral changes to verify manually
            (list changes not covered by tests, or "All changes covered by tests")
            </pr-description>

            Refer to CLAUDE.md for project conventions.

      # ── Save Claude output ──
      - name: Save Claude output to file
        if: steps.check.outputs.fixed == 'true'
        env:
          CLAUDE_OUTPUT: ${{ steps.claude.outputs.result }}
        run: printf '%s' "$CLAUDE_OUTPUT" > /tmp/claude-output.txt

      # ── Commit and push ──
      - name: Commit and push
        if: steps.check.outputs.fixed == 'true'
        env:
          BRANCH: security/fix-${{ matrix.issue.pkg }}-${{ matrix.issue.cve }}
          FOREST_PARENT: ${{ steps.check.outputs.forest_parent }}
          NEW_VERSION: ${{ steps.check.outputs.new_version }}
          CVE: ${{ matrix.issue.cve }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json yarn.lock package-lock.json pnpm-lock.yaml 2>/dev/null || true
          git add '*/package.json' 2>/dev/null || true
          git add -u  # stage modifications to already-tracked files only
          git reset -- '*.log' 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 1
          fi
          git commit -m "fix(deps): bump $FOREST_PARENT to $NEW_VERSION [$CVE]"
          git push --force-with-lease origin "$BRANCH"

      # ── Create or update PR ──
      - name: Create or update PR
        if: steps.check.outputs.fixed == 'true'
        env:
          GH_TOKEN: ${{ secrets.REPO_TOKEN }}
          BRANCH: security/fix-${{ matrix.issue.pkg }}-${{ matrix.issue.cve }}
          FOREST_PARENT: ${{ steps.check.outputs.forest_parent }}
          NEW_VERSION: ${{ steps.check.outputs.new_version }}
          CVE: ${{ matrix.issue.cve }}
          SEVERITY: ${{ matrix.issue.severity }}
          SECURITY_LABEL: ${{ inputs.security_label }}
          ISSUE_NUMBER: ${{ matrix.issue.issue_number }}
        run: |
          # Extract PR description from Claude's output file
          PR_BODY=$(sed -n '/<pr-description>/,/<\/pr-description>/p' /tmp/claude-output.txt | sed '1d;$d' || true)
          if [ -z "$PR_BODY" ]; then
            PR_BODY="## Security fix: bump $FOREST_PARENT to $NEW_VERSION [$CVE]

          Closes #$ISSUE_NUMBER

          Severity: **$SEVERITY**

          Automated security bump by Claude Code.

          $(cat /tmp/claude-output.txt)"
          fi

          PR_TITLE="fix(deps): bump $FOREST_PARENT to $NEW_VERSION [$CVE]"

          # Check if a PR already exists for this branch
          EXISTING_PR=$(gh pr view "$BRANCH" --json number --jq '.number' 2>/dev/null || true)

          if [ -n "$EXISTING_PR" ]; then
            echo "Updating existing PR #$EXISTING_PR"
            gh pr edit "$EXISTING_PR" \
              --title "$PR_TITLE" \
              --body "$PR_BODY"
            gh pr comment "$EXISTING_PR" --body "🔄 Re-ran security fix workflow — PR updated with new changes."
          else
            gh pr create \
              --title "$PR_TITLE" \
              --body "$PR_BODY" \
              --label "$SECURITY_LABEL" \
              --head "$BRANCH"
          fi

      # ── Close the tracking issue ──
      - name: Close tracking issue
        if: steps.check.outputs.fixed == 'true'
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ matrix.issue.issue_number }}
          FOREST_PARENT: ${{ steps.check.outputs.forest_parent }}
          NEW_VERSION: ${{ steps.check.outputs.new_version }}
        with:
          script: |
            const issueNumber = parseInt(process.env.ISSUE_NUMBER, 10);
            const parent = process.env.FOREST_PARENT;
            const newVersion = process.env.NEW_VERSION;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `✅ Upstream fix available: \`${parent}@${newVersion}\`. A PR has been opened automatically.`,
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              state: 'closed',
              state_reason: 'completed',
            });

      # ── Flag stale issues (SLA based on EPSS) ──
      - name: Flag stale issue
        if: steps.check.outputs.fixed == 'false'
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ matrix.issue.issue_number }}
          CREATED_AT: ${{ matrix.issue.created_at }}
          DEFAULT_STALE_DAYS: ${{ inputs.stale_days }}
          SLA_DAYS: ${{ matrix.issue.sla_days }}
          EPSS: ${{ matrix.issue.epss }}
        with:
          script: |
            const issueNumber = parseInt(process.env.ISSUE_NUMBER, 10);
            const createdAt = new Date(process.env.CREATED_AT);
            const defaultStaleDays = parseInt(process.env.DEFAULT_STALE_DAYS, 10);
            const epss = parseFloat(process.env.EPSS) || 0;

            // Use EPSS-based SLA if available, otherwise fall back to default
            let staleDays = defaultStaleDays;
            if (process.env.SLA_DAYS) {
              staleDays = parseInt(process.env.SLA_DAYS, 10);
            } else if (epss > 0.7) {
              staleDays = 3;
            } else if (epss > 0.4) {
              staleDays = 7;
            }

            const now = new Date();
            const ageInDays = Math.floor((now - createdAt) / (1000 * 60 * 60 * 24));

            if (ageInDays >= staleDays) {
              // Check if we already added the stale label
              const { data: labels } = await github.rest.issues.listLabelsOnIssue({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
              });

              if (!labels.some(l => l.name === 'stale-upstream')) {
                // Ensure label exists
                try {
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name: 'stale-upstream',
                    color: 'e4e669',
                    description: 'Upstream fix has been pending for too long',
                  });
                } catch (e) {
                  // Label may already exist
                }

                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  labels: ['stale-upstream'],
                });

                const slaNote = epss > 0
                  ? ` SLA was **${staleDays} days** based on EPSS score of ${epss}.`
                  : '';

                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  body: `⚠️ This vulnerability has been waiting for an upstream fix for **${ageInDays} days**.${slaNote} Consider escalating with the Forest Admin package maintainers or finding an alternative workaround.`,
                });
              }
            }
