# Copy this file to each repo: .github/workflows/security-auto-fix.yml
#
# Thin caller workflow — all logic lives in forestadmin/.github

name: Security auto-fix

on:
  repository_dispatch:
    types: [dependabot_alert_created]
  workflow_dispatch:
    inputs:
      package_name:
        description: Vulnerable package name
        required: true
      cve_id:
        description: CVE identifier
        required: true
      severity:
        description: Vulnerability severity (high or critical)
        required: true
      patched_version:
        description: First patched version
        required: true
      vulnerable_range:
        description: Vulnerable version range
        required: true
      summary:
        description: Advisory summary
        required: true

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  fix:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.client_payload.alert.security_vulnerability.severity == 'high' ||
       github.event.client_payload.alert.security_vulnerability.severity == 'critical') &&
      github.event.client_payload.alert.dependency.scope != 'development'
    uses: forestadmin/.github/.github/workflows/fix-vulnerability.yml@main
    with:
      package_name: ${{ inputs.package_name || github.event.client_payload.alert.security_vulnerability.package.name }}
      cve_id: ${{ inputs.cve_id || github.event.client_payload.alert.security_advisory.cve_id }}
      severity: ${{ inputs.severity || github.event.client_payload.alert.security_vulnerability.severity }}
      patched_version: ${{ inputs.patched_version || github.event.client_payload.alert.security_vulnerability.first_patched_version.identifier }}
      vulnerable_range: ${{ inputs.vulnerable_range || github.event.client_payload.alert.security_vulnerability.vulnerable_version_range }}
      summary: ${{ inputs.summary || github.event.client_payload.alert.security_advisory.summary }}
      # Uncomment to override defaults:
      # default_assignee_team: forestadmin/platform
      # node_version: '22'
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
